name: Build HamZam APK

on:
  workflow_dispatch:
  push:
    branches:
      - utama

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q HamZam_APK_Project.zip -d build_project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build_project
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: HamZam-APK
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
